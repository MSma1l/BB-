server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep auto-added trailing-slash redirects relative, so they preserve the
    # host:port the client used (e.g. behind a proxy or a non-80 published port).
    absolute_redirect off;

    # Reverse-proxy the API. Tuned for SSE (EventSource) streams so they stay open.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering/caching and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploaded media, served by the backend's static handler.
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA route (static export uses trailingSlash -> folder with index.html).
    location /admin-bb/ {
        try_files $uri $uri/ /admin-bb/index.html;
    }

    # Static site: serve the exported folders/files (trailingSlash export).
    location / {
        try_files $uri $uri/ =404;
    }
}
