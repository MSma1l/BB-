# Cache policy by path. HTML shells MUST revalidate so a new deploy is seen
# immediately — otherwise a returning visitor keeps running an old JS bundle
# against the current backend (e.g. the old conversation-id format → 409 → the
# chat message is silently dropped and never notified). Content-hashed assets
# and media are safe to cache long.
map $uri $bb_cache_control {
    default                                             "no-cache";
    ~*^/_next/static/                                   "public, max-age=31536000, immutable";
    ~*\.(?:js|css|woff2?|ttf|otf|eot)$                  "public, max-age=31536000, immutable";
    ~*\.(?:jpg|jpeg|png|webp|gif|svg|ico|mp4|mp3|webm)$ "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit `; charset=utf-8` on text responses so it's declared in the HTTP
    # Content-Type header, not just the HTML <meta charset> (QA-5 QA5-02). Applies
    # to text/html plus the listed types.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml text/plain;

    # Don't leak the nginx version (QA-1 BUG: server version disclosure).
    server_tokens off;

    # Security headers (QA-1 BUG #4). Sent on every response — including the
    # proxied /api and /uploads locations, since none of them override add_header
    # (nginx only drops inherited add_headers when a location adds its own).
    # `always` so they're emitted on error responses too. HSTS is set at the
    # TLS-terminating host proxy (deploy/nginx-host.conf.example), not here, as
    # this container serves plain HTTP behind that proxy.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tuned to how the app is built: inline styles throughout, inline hydration
    # scripts (Next.js) and the R3F hero → 'unsafe-inline'; base64/remote-free
    # images and self-hosted fonts as data:; same-origin media (intro video +
    # background music); EventSource (SSE) + API calls are same-origin.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    # Per-path cache policy (see the map above). Server-level so it's inherited by
    # every location alongside the security headers (nginx only drops inherited
    # add_headers where a location adds its own — none here do).
    add_header Cache-Control $bb_cache_control always;

    # Keep auto-added trailing-slash redirects relative, so they preserve the
    # host:port the client used (e.g. behind a proxy or a non-80 published port).
    absolute_redirect off;

    # Allow raw photo uploads through (nginx defaults to 1m → real photos 413).
    # The backend then compresses them to WebP under IMAGE_MAX_MB.
    client_max_body_size 12m;

    # Reverse-proxy the API. Tuned for SSE (EventSource) streams so they stay open.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering/caching and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploaded media, served by the backend's static handler.
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA route (static export uses trailingSlash -> folder with index.html).
    location /admin-bb/ {
        try_files $uri $uri/ /admin-bb/index.html;
    }

    # Static site: serve the exported folders/files (trailingSlash export).
    location / {
        try_files $uri $uri/ =404;
    }
}
