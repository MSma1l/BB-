# ============================================================================
#  Balloons Breeze — vhost for `nginx_proxy` (the shared public proxy)
# ----------------------------------------------------------------------------
#  Domain   : balloonsbreeze.md (+ www)
#  Upstream : container `balloonsbreeze-web:80` on network `shared-network`
#  Place at : /root/nginx-proxy/conf.d/balloonsbreeze.conf
#  Reload   : docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
#
#  ⚠️ FIRST TIME the cert doesn't exist yet → `nginx -t` fails on the 443 block.
#  Procedure (same as your iqarena-game runbook):
#    1. Add ONLY the HTTP :80 block below (comment out the whole 443 block).
#    2. Reload:  docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
#    3. Issue the cert (webroot — see DEPLOY step).
#    4. Uncomment the 443 block, reload again.
# ============================================================================

# --- HTTP :80 — ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    server_name balloonsbreeze.md www.balloonsbreeze.md;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — the app ---
server {
    listen 443 ssl;
    http2 on;
    server_name balloonsbreeze.md www.balloonsbreeze.md;

    ssl_certificate     /etc/letsencrypt/live/balloonsbreeze.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloonsbreeze.md/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Photo uploads (MAX_UPLOAD_MB=8) + multipart overhead.
    client_max_body_size 12m;

    # Docker embedded DNS so the upstream resolves lazily (container may restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bb http://balloonsbreeze-web:80;

    # /api/ — SSE streams (chat/photos/texts/reviews). Must NOT be buffered.
    location /api/ {
        proxy_pass $bb;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else: static site, /uploads/, /admin-bb/ (the app's own nginx
    # handles routing + serves /admin-bb).
    location / {
        proxy_pass $bb;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
