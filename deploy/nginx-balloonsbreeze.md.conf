# =============================================================================
# HOST nginx reverse proxy for balloonsbreeze.md  (ready-to-use)
# =============================================================================
# Runs on the SERVER's own nginx (apt), in front of the loopback-bound web
# container from docker-compose.prod.yml at 127.0.0.1:8080.
#
#   Internet ─443/TLS─▶ host nginx (this file) ─▶ 127.0.0.1:8080 ─▶ web (docker)
#                                                     ├─ static site
#                                                     ├─ /api/     → backend:4000
#                                                     └─ /uploads/ → backend:4000
#
# INSTALL
#   sudo cp deploy/nginx-balloonsbreeze.md.conf \
#           /etc/nginx/sites-available/balloonsbreeze.md.conf
#   sudo ln -s /etc/nginx/sites-available/balloonsbreeze.md.conf /etc/nginx/sites-enabled/
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d balloonsbreeze.md -d www.balloonsbreeze.md
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: add A records  balloonsbreeze.md → <server IP>  and  www → <server IP>.
# If WEB_PORT in .env is not 8080, change the proxy_pass ports below.
# =============================================================================

# --- Port 80: ACME challenges + redirect to HTTPS ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name balloonsbreeze.md www.balloonsbreeze.md;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://balloonsbreeze.md$request_uri;
    }
}

# --- Port 443 (www): redirect www → apex over HTTPS --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.balloonsbreeze.md;

    ssl_certificate     /etc/letsencrypt/live/balloonsbreeze.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloonsbreeze.md/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://balloonsbreeze.md$request_uri;
}

# --- Port 443 (apex): TLS + reverse proxy to the web container ---------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name balloonsbreeze.md;

    ssl_certificate     /etc/letsencrypt/live/balloonsbreeze.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloonsbreeze.md/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Photo uploads (MAX_UPLOAD_MB=8) + multipart overhead. Must exceed 8m.
    client_max_body_size 12m;

    # /api/ — SSE streams (chat/photos/texts/reviews). Must NOT be buffered.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else: static site, /uploads/, /admin-bb/ (Basic Auth handled by
    # the container's own nginx).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }
}
